[project]
name = "tauri-fasthtml-server"
version = "0.1.0"
description = "FastHTML application bundled and run inside the Tauri desktop shell"
requires-python = ">=3.10"
dependencies = [
    "python-fasthtml",
    "uvicorn",
    "mcp",
    "playwright",
    "platformdirs",
    "pywin32; sys_platform == 'win32'",
]

[tool.uv]
package = false
